stages:
  - test
  - build

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"

android_unit_tests:
  stage: test
  image: ghcr.io/cirruslabs/android-sdk:36
  before_script:
    - printf 'MAPS_API_KEY=placeholder_maps_api_key_ci_build\nFIREBASE_APPCHECK_DEBUG_TOKEN=placeholder_token\n' > .env
    - keytool -genkey -v -keystore debug.keystore -keyalg RSA -keysize 2048 -validity 10000 -alias androiddebugkey -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" || true
  script:
    - ./gradlew testDebugUnitTest --stacktrace --no-daemon

android_debug_apk:
  stage: build
  image: ghcr.io/cirruslabs/android-sdk:36
  before_script:
    - printf 'MAPS_API_KEY=placeholder_maps_api_key_ci_build\nFIREBASE_APPCHECK_DEBUG_TOKEN=placeholder_token\n' > .env
    - keytool -genkey -v -keystore debug.keystore -keyalg RSA -keysize 2048 -validity 10000 -alias androiddebugkey -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" || true
  script:
    - ./gradlew assembleDebug --stacktrace --no-daemon
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - app/build/outputs/apk/debug/*.apk
